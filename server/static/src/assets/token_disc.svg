<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top-down flat disc (checker piece). Flat color with subtle edge
       bevel and inner ring — like looking straight down at a wooden disc
       sitting on felt. Base color is red; use CSS filter for other colors. -->
  <!-- Outer shadow ring -->
  <circle cx="50" cy="51" r="43" fill="rgba(0,0,0,0.12)"/>
  <!-- Main disc body — flat, uniform color -->
  <circle cx="50" cy="50" r="42" fill="#CC0000"/>
  <!-- Inner ring groove (recessed line) -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <!-- Top edge highlight (very subtle, just a thin arc at the top) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"
          stroke-dasharray="66 198"/>
  <!-- Bottom edge shadow (thin arc at the bottom) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"
          stroke-dasharray="66 198" stroke-dashoffset="-132"/>
</svg>
